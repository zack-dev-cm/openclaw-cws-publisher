[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-cws-publisher"
version = "0.3.2"
description = "Release kit for packaging and hardening Chrome extensions with CWS package, listing, E2E, design, Chrome release, competitor, leak, and publish gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zack" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
